name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y lua5.2
      - run: pip install pillow
      - name: Card data and art are up to date with cards.csv
        run: |
          python tools/csv2json.py games/sample/cards.csv
          python tools/make_sheets.py games/sample --title "Ember Guilds"
          git diff --exit-code -- games/sample/cards.json games/sample/art.json
      - run: python tools/bundle.py games/sample
      - run: lua tests/run.lua
      - run: lua tests/fuzz.lua
      - name: Lantern Fair's card data and art are up to date with cards.csv
        run: |
          python tools/csv2json.py games/lantern/cards.csv
          python tools/make_sheets.py games/lantern --title "Lantern Fair"
          git diff --exit-code -- games/lantern/cards.json games/lantern/art.json
      - run: python tools/bundle.py games/lantern -o build/lantern/Global.lua
      - run: lua tests/lantern.lua
      - name: The blank template builds and plays
        run: |
          python tools/csv2json.py games/template/cards.csv
          python tools/make_sheets.py games/template --title "My Game"
          git diff --exit-code -- games/template/cards.json games/template/art.json
          python tools/bundle.py games/template -o build/template/Global.lua
          CZ_BUILD=build/template/Global.lua lua tests/smoke.lua
          CZ_BUILD=build/lantern/Global.lua lua tests/smoke.lua
